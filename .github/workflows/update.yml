name: Update Hadestown cast changes

on:
  schedule:
    # 1:30 PM and 2:30 PM Eastern on Wednesdays, Saturdays, and Sundays.
    - cron: "30 13 * * 0,3,6"
      timezone: "America/New_York"
    - cron: "30 14 * * 0,3,6"
      timezone: "America/New_York"
    # Daily at 6:30 PM and 7:30 PM Eastern.
    - cron: "30 18 * * *"
      timezone: "America/New_York"
    - cron: "30 19 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hadestown-cast-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh performance data and graph
        run: |
          python3 scrape.py
          python3 fetch_headshots.py
          python3 build_graph.py
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last_run.txt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Hadestown cast data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
